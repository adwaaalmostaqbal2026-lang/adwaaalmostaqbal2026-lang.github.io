<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>مصنع أضواء المستقبل للتصنيع — شكل الكيس 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{background:linear-gradient(#f3f6f8,#c9d7e2);display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#6b1616;color:#f3e7c4;border-bottom:2px solid #c9a23a}
header img{width:36px;height:36px;border-radius:8px;background:#fff}
header b{font-size:17px}header small{display:block;font-size:12px;opacity:.85;font-weight:400}
#stage{position:relative;flex:1;min-height:0}
#opts{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#fff}#opts button{flex:none;padding:6px 12px;border-radius:16px;border:1px solid #c9a23a;background:#fff8e8;color:#6b1616;font:inherit;font-size:14px;cursor:pointer}#opts button[aria-pressed=true]{background:#6b1616;color:#f3e7c4}
#prices{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 1px 6px rgba(0,0,0,.15);max-width:60vw}#prices table{border-collapse:collapse}#prices th,#prices td{padding:3px 8px;border-bottom:1px solid #eee;text-align:center}#prices .ptg{border:0;background:transparent;font:inherit;font-weight:700;color:#6b1616;cursor:pointer;padding:2px 4px}#prices .pnote{font-size:11px;color:#666;margin-top:4px}
#bar{flex:none;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e5d3a8;align-items:center;flex-wrap:wrap}#bar button{flex:1;min-width:130px;padding:11px;border-radius:10px;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer}#bOk{background:#2e7d32;color:#fff}#bNote{background:#fff8e8;color:#6b1616;border:1px solid #c9a23a!important}
#ans{width:100%;font-size:13px;color:#2e5e2e}
#ansBox{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}#ansBox[hidden]{display:none}#ansBox .card{background:#fff;width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:14px;display:flex;flex-direction:column;gap:8px}#ansBox textarea,#ansBox input{font:inherit;padding:8px;border-radius:8px;border:1px solid #ccc}#ansBox .row{display:flex;gap:8px}#ansBox .row button{flex:1;padding:10px;border-radius:8px;border:0;font:inherit;cursor:pointer}#ansSend{background:#6b1616;color:#fff}#ansErr{font-size:13px;color:#b71c1c}
#info{flex:none;background:#fff8e8;color:#4a2a10;border-bottom:1px solid #e5d3a8;padding:7px 14px;font-size:14px;line-height:1.5}#info b{color:#6b1616}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.tools{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:2}
.tools button{width:44px;height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.9);color:#222;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.18)}
#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);padding:14px 20px;border-radius:12px;font-size:16px;color:#333;text-align:center}
</style>

<script>
// EngView library resize engine: band-stretch of a design to new L/W/H + per-band overrides.
// Design: {d:[L,W,H], bx/by:[[a,b,label,mult]], P:[[cut, x0,y0,x1,y1,...]]}. Units mm, y down.
// label: 'L','W','H' (band = mult*dim + fixed offset), 'W~' (proportional flap, mult = band/W), '' fixed.
const LIB = {
  bandTargets(bands, d0, d1, ov, add) {
    const idx = { L: 0, W: 1, H: 2 };
    return bands.map((b, i) => {
      const w0 = b[1] - b[0];
      if (ov && ov[i] != null && ov[i] !== '' && isFinite(+ov[i])) return +ov[i];
      const lab = b[2];
      if (lab === 'W~') return Math.max(0, w0 * (d1[1] / d0[1]));
      if (lab in idx) { const k = idx[lab]; return Math.max(0, w0 + b[3] * (d1[k] - d0[k]) + ((add && add[i]) || 0)); }
      return Math.max(0, w0 + ((add && add[i]) || 0));
    });
  },
  // piecewise-linear monotone map old->new for one axis; rigid margins near band edges
  axisMap(bands, targets) {
    const K = [];  // knots [old,new]

    const il = nx * ny;
    const mixA = il + (y >= Bw ? INT(Math.max(0, x - ((nx > 0 && ny > 0) ? Bw + (nx - 1) * (pitch + g) + g : 0) + g) / (Bh + g)) * INT((y + g) / (Bw + g)) : 0);
    const mixB = il + (x >= Bh ? INT((x + g) / (Bh + g)) * INT(Math.max(0, y + g - ny * (Bh + g)) / (Bw + g)) : 0);
    const ILX = il > 0 ? Bw + (nx - 1) * (pitch + g) : 0;
    const ILY = il > 0 ? ny * (Bh + g) - g : 0;
    const kA = INT(Math.max(0, x - ((nx > 0 && ny > 0) ? Bw + (nx - 1) * (pitch + g) + g : 0) + g) / (Bh + g));
    const rA = INT((y + g) / (Bw + g));
    const kB = INT((x + g) / (Bh + g));
    const rB = INT(Math.max(0, y + g - ny * (Bh + g)) / (Bw + g));
    const ext = [
      [grid > 0 ? INT((x + g) / (Bw + g)) * (Bw + g) - g : 0, grid > 0 ? INT((y + g) / (Bh + g)) * (Bh + g) - g : 0],
      [ILX, ILY],
      [mixA > il ? (il > 0 ? ILX + g : 0) + kA * (Bh + g) - g : ILX, Math.max(ILY, mixA > il ? rA * (Bw + g) - g : 0)],
      [Math.max(ILX, mixB > il ? kB * (Bh + g) - g : 0), mixB > il ? (il > 0 ? ny * (Bh + g) : 0) + rB * (Bw + g) - g : ILY],
    ];
    return { counts: [grid, il, mixA, mixB], ext, nx, ny };
  }

  const machines = P.machines.map((M, mi) => {
    const sx = G && G.sideExt ? 2 * (+M.side || 0) : 0;   // unprinted ends (bag top turn / bottom flap) may run into the side margins
    const X = M.SW - 2 * M.side + sx, Y = M.SH - M.grip - M.side;
    if (G && G.nestFor) {
      const r = G.nestFor(X, Y, M), used = r.n ? [r.ew, r.eh] : [0, 0];   // (X already has the side margins when allowed)
      const cut = r.n ? [used[0] + C.sheetAdd, used[1] + C.sheetAdd] : [0, 0];
      return { name: M.name, M, X, Y, ups: r.n, choice: 0, used, cut, cutArea: cut[0] * cut[1] / 1e6, nx: 0, ny: 0, nest: r, sx };
    }
    const gx = G && G.gripExt > 0 ? Math.min(+G.gripExt, (+M.grip || 0) + 1) : 0;   // unprinted glue flap allowed into the gripper margin (first row only)
    // standing (o2): glue in the gripper, top turn / bottom in the side margins (sx).
    // lying (o1): the glue of the first piece in ONE side margin only; nothing else leaves the print area.
    const gxs = G && G.gripExt > 0 ? Math.min(+G.gripExt, (+M.side || 0) + 1) : 0, X1 = X - sx + gxs;
    const o1 = orient(X1, Y), o2 = orient(Y + gx, X);
    const counts = [...o1.counts, ...o2.counts];
    const ext = [...o1.ext, ...o2.ext.map(([a, b]) => [b, a])];
    const best = Math.max(...counts);
    let choice = 0, bestScore = -Infinity;
    counts.forEach((c, i) => { const s = c * 1e7 - ext[i][0] * ext[i][1]; if (s > bestScore) { bestScore = s; choice = i; } });
    const used = best > 0 ? ext[choice] : [0, 0];
    const over = choice >= 4 ? Math.max(0, used[1] - Y) : 0;   // part of the glue flap lying in the gripper
    const overX = choice < 4 ? Math.max(0, used[0] - (X - sx)) : 0;   // part of the glue flap lying in a side margin
    const shiftX = choice < 4 ? overX : sx / 2;
    const cut = best > 0 ? [Math.min(M.SW, used[0] - overX + C.sheetAdd), Math.min(M.SH, used[1] - over + C.sheetAdd)] : [0, 0];   // never bigger than the press sheet
    const Xf = choice < 4 ? X - sx + overX : X;   // room measured from the start of the block (for the base / card)
    return { name: M.name, M, X: Xf, Y, ups: best, choice, used, cut, cutArea: cut[0] * cut[1] / 1e6, gx, over, sx, overX, shiftX,
             nx: choice < 4 ? o1.nx : o2.nx, ny: choice < 4 ? o1.ny : o2.ny };
  });

  const paperTon = name => { const p = P.papers.find(p => p.name === name); return p ? +p.ton : 0; };
  // finish sides: 0 = none, 1 = one face, 2 = both faces (true counts as 1)
  const sd = k => { const v = I.finishes[k]; return v === true ? 1 : Math.max(0, Math.min(2, +v || 0)); };
  const yes = k => sd(k) > 0;
  const nFin = ['cello', 'oil', 'uv', 'spot', 'emb', 'foil'].reduce((a, k) => a + sd(k), 0);
  const colB = cIdx === 2 ? 0 : +I.colB;
  const colF = +I.colF;
  const dieSep = C.dieSep !== false;
  // profit: fixed %, or by quantity from the tier table [[fromQty, pct], ...]
  const tiers = (Array.isArray(C.profitTiers) ? C.profitTiers : []).filter(r => r && r[0] > 0).sort((a, b) => a[0] - b[0]);
  const profitOf = q => {
    if (I.profitMode !== 'tier' || !tiers.length) return +I.profit || 0;
    let p = tiers[0][1];
    for (const [tq, tp] of tiers) if (q >= tq) p = tp;
    return +p;
  };

  const perMachine = machines.map(m => {
    const M = m.M;
    const pu = paperSrcUse(I, m.cut[0], m.cut[1]);
    const A = pu ? pu.per : C.areaMode === 'machine' ? M.SW * M.SH / 1e6 : m.cutArea;   // paper bought per press sheet
    m.paperU = pu;
    const Pf = A * I.faceGsm / 1000 * paperTon(I.faceP) / 1000;
    const Ps = cIdx === 1 ? 0 : A * (flute.medGsm * flute.take / 1000 * paperTon(P.fluteMedPaper) / 1000 + flute.linGsm / 1000 * paperTon(P.fluteLinPaper) / 1000);
    const Pb = cIdx === 3 ? A * I.backGsm / 1000 * paperTon(I.backP) / 1000 : 0;
    const MR = (colF > 0 ? C.mrPrint + C.mrColor * colF : 0) + (colB > 0 ? C.mrPrint + C.mrColor * colB : 0) + (cIdx > 1 ? C.mrLam : 0) + C.mrFinish * nFin + C.mrDie;
    const rule = m.nest ? (m.nest.knifeCut + m.nest.knifeCrease) / 1000 : m.ups * ruleUp;
    const cutUp = G && G.cutUp != null ? G.cutUp : (I._cutUp != null ? I._cutUp : null);
    const creaseUp = G && G.creaseUp != null ? G.creaseUp : (I._creaseUp != null ? I._creaseUp : null);
    const cutM = m.nest ? m.nest.knifeCut / 1000 : (cutUp != null ? m.ups * cutUp : null);
    const creaseM = m.nest ? m.nest.knifeCrease / 1000 : (creaseUp != null ? m.ups * creaseUp : null);
    const billA = (+M.billL || 0) * (+M.billW || 0) / 10000; // m2 used for cello / UV / spot UV
    return { A, Pf, Ps, Pb, MR, rule, billA, cutM, creaseM };
  });

  const rows = I.qtys.map(q => {
    q = +q;
    const opts = machines.map((m, i) => {
      if (!(m.ups > 0) || !(q > 0)) return null;
      const M = m.M, k = perMachine[i];
      const net = Math.ceil(q * (+I.pcs > 0 ? +I.pcs : 1) / m.ups);   // pieces per box (a bag cut in two halves, cards per bag...)
      const sheets = Math.ceil(net * (1 + C.runWaste)) + k.MR;
      const run = Math.max(sheets, M.minrun) / 1000;
      const paper = sheets * (k.Pf + k.Ps + k.Pb);
      const lam = cIdx === 1 ? 0 : sheets * (k.billA > 0 ? k.billA : k.A) * C.lamM2 * (cIdx - 1);   // billed by the machine's sheet class (فرخ 70×100, نص 50×70, ربع 35×50)
      const print = (colF > 0 ? colF * (M.plate + run * M.print) : 0) + (colB > 0 ? colB * (M.plate + run * M.print) : 0);
      const fin = sd('cello') * sheets * k.billA * C.celloM2 + sd('oil') * run * M.oil + sd('uv') * sheets * k.billA * C.uvM2
        + sd('spot') * (C.spotSetup + sheets * k.billA * C.spotM2) + sd('emb') * (C.embBlock + run * M.emb) + sd('foil') * (C.foilBlock + run * M.foil);
      const dCut = C.dieCutM != null ? +C.dieCutM : +C.dieMeter, dCrease = C.dieCreaseM != null ? +C.dieCreaseM : 18;
      const die = (I.newDie && !noDie) ? +C.dieBase + (k.cutM != null ? dCut * k.cutM + dCrease * k.creaseM : C.dieMeter * k.rule) : 0;
      const dc = noDie ? 0 : Math.max(M.dcmin, sheets / 1000 * M.dc);
      const pack = q / 1000 * C.packK;
      const glue = gluePcs ? q / 1000 * (+C.glueK || 0) * gluePcs : 0;
      const make = extraK ? q / 1000 * extraK : 0;
      const sub = paper + lam + print + fin + die + dc + pack + glue + make;
      const ovh = sub * C.overhead;
      const total = sub + ovh;
      const boxtot = total - (dieSep ? die * (1 + C.overhead) : 0);
      const kgOf = gsm => sheets * k.A * gsm / 1000;
      const mats = [];
      mats.push({ role: cIdx === 1 ? 'board' : 'face', name: I.faceP, gsm: +I.faceGsm, kg: kgOf(I.faceGsm), cost: sheets * k.Pf });
      if (cIdx > 1) {
        const medKg = kgOf(flute.medGsm * flute.take), linKg = kgOf(flute.linGsm);
        mats.push({ role: 'medium', name: P.fluteMedPaper, gsm: flute.medGsm, take: flute.take, kg: medKg, cost: medKg / 1000 * paperTon(P.fluteMedPaper) });
        mats.push({ role: 'liner', name: P.fluteLinPaper, gsm: flute.linGsm, kg: linKg, cost: linKg / 1000 * paperTon(P.fluteLinPaper) });
      }
      if (cIdx === 3) mats.push({ role: 'back', name: I.backP, gsm: +I.backGsm, kg: kgOf(I.backGsm), cost: sheets * k.Pb });
      const sheetSize = C.areaMode === 'machine' ? [M.SW, M.SH] : m.cut;
      // what to buy from the supplier for these press sheets
      const pu = m.paperU, cutTxt = Math.round(m.cut[0] / 10 * 10) / 10 + '×' + Math.round(m.cut[1] / 10 * 10) / 10 + ' سم';
      const buy = pu && pu.stock ? { qty: Math.ceil(sheets / pu.n), unit: 'شيت ' + pu.stock[0] + '×' + pu.stock[1], note: (pu.n > 1 ? 'كل شيت بيطلع ' + pu.n + ' فرخ ' : 'كل شيت = فرخ ') + cutTxt }
        : pu && pu.along ? { qty: Math.ceil(sheets * pu.along / 100 / pu.n), unit: 'متر بكرة ' + (+(I.paperSrc || {}).roll || 0) + ' سم', note: (pu.n > 1 ? pu.n + ' فرخ في العرض' : 'فرخ في العرض') + '، فرخ ' + cutTxt }
        : { qty: sheets, unit: 'فرخ ' + cutTxt, note: 'على قد المقاس' };
      mats.forEach(mt => { if (mt.role !== 'medium' && mt.role !== 'liner') mt.buy = buy; });
      return { mi: i, net, sheets, mr: k.MR, paper, lam, print, fin, die, dc, pack, glue, make, ovh, total, boxtot, mats, sheetSize, matA: k.A, billA: k.billA, rule: k.rule, cutM: k.cutM, creaseM: k.creaseM };
    });
    let pick = null;
    if (I.machine === 'auto') {
      const valid = opts.filter(Boolean);
      if (valid.length) { const mn = Math.min(...valid.map(o => o.total)); pick = valid.find(o => o.total === mn); }
    } else pick = opts[I.machine] || null;
    if (!pick) return { qty: q, ok: false };
    const unit = pick.boxtot / q;
    const profit = profitOf(q);
    const sell = unit * (1 + profit);
    const selltot = sell * q;
    const diesell = dieSep ? pick.die * (1 + C.dieProfit) : 0;
    const vat = (selltot + diesell) * C.vat;
    return { qty: q, ok: true, ...pick, machine: machines[pick.mi].name, ups: machines[pick.mi].ups,
             unit, profit, sell, sellh: sell * 100, selltot, diesell, vat, grand: selltot + diesell + vat };
  });

  return { t, Bw, Bh, pitch, zones, ear, earAuto, machines, rows };
}

// Placement of every blank on the chosen layout (same rules as the VBA drawing)
function layout0427(R, m) {
  const mm = R.machines[m];
  if (!(mm.ups > 0)) return [];
  const k = mm.choice + 1, o = k <= 4 ? 1 : 2, typ = ((k - 1) % 4) + 1;
  const { Bw, Bh, pitch: P } = R, g = 0;
  const lx = o === 1 ? mm.X : mm.Y + (mm.gx || 0), ly = o === 1 ? mm.Y : mm.X;
  const nx = mm.nx, ny = mm.ny, pts = [];
  if (typ === 1) {
    if (lx >= Bw && ly >= Bh) for (let j = 0; j < Math.floor((ly + g) / (Bh + g)); j++) for (let i = 0; i < Math.floor((lx + g) / (Bw + g)); i++) pts.push([i * (Bw + g), j * (Bh + g), false, false]);
  } else {
    if (nx > 0 && ny > 0) for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) pts.push([i * (P + g), j * (Bh + g), false, i % 2 === 1]);
    if (typ === 3 && ly >= Bw) {
      const x0 = nx > 0 && ny > 0 ? Bw + (nx - 1) * (P + g) + g : 0;
      const kk = Math.floor(Math.max(0, lx - x0 + g) / (Bh + g)), rr = Math.floor((ly + g) / (Bw + g));
      for (let a = 0; a < kk; a++) for (let b = 0; b < rr; b++) pts.push([x0 + a * (Bh + g), b * (Bw + g), true, false]);
    } else if (typ === 4 && lx >= Bh) {
      const y0 = ny * (Bh + g), kk = Math.floor((lx + g) / (Bh + g)), rr = Math.floor(Math.max(0, ly + g - y0) / (Bw + g));
      for (let a = 0; a < kk; a++) for (let b = 0; b < rr; b++) pts.push([a * (Bh + g), y0 + b * (Bw + g), true, false]);
    }
  }
  return pts.map(([px, py, rot, flip]) => {
    const p = o === 1 ? { x: px, y: py, wx: !rot } : { x: py, y: px, wx: rot };
    p.x += mm.M.side - (mm.shiftX != null ? mm.shiftX : (mm.sx || 0) / 2); p.y += Math.max(0, mm.M.grip - (mm.over || 0)); p.flip = flip; p.rot = rot;
    p.rects = R.zones.map(([z0, z1, wz]) => p.wx
      ? [p.x + (Bw - wz) / 2, p.y + (flip ? Bh - z1 : z0), wz, z1 - z0]
      : [p.x + (flip ? Bh - z1 : z0), p.y + (Bw - wz) / 2, z1 - z0, wz]);
    return p;
  });
}

// Size hints: for each machine, the smallest single change (L, W, D or lid ear) that fits more boxes per sheet.
function suggest0427(P, I) {
  const base = calc0427(P, Object.assign({}, I, { qtys: [] }));
  const upsOf = J => calc0427(P, Object.assign({}, I, J, { qtys: [] })).machines.map(m => m.ups);
  const cur = base.machines.map(m => m.ups);
  const out = base.machines.map((m, i) => ({ name: m.name, ups: cur[i], tips: [] }));
  const dims = [['L', 'الطول L'], ['W', 'العرض W'], ['D', 'الارتفاع D']];
  for (const [k, label] of dims) {
    const v = +I[k], maxCut = Math.floor(v * 0.25);
    const found = out.map(() => null);
    for (let d = 1; d <= maxCut; d++) {
      const u = upsOf({ [k]: v - d });
      u.forEach((n, i) => { if (!found[i] && n > cur[i]) found[i] = { d, n }; });
      if (found.every(Boolean)) break;
    }
    found.forEach((f, i) => { if (f) out[i].tips.push({ key: k, label, from: v, to: v - f.d, cut: f.d, ups: f.n }); });
  }
  // lid ear: shorten down to 10 mm
  const ear0 = base.ear, found = out.map(() => null);
  for (let e = Math.floor(ear0 - 1); e >= 10; e--) {
    const u = upsOf({ ear: e });
    u.forEach((n, i) => { if (!found[i] && n > cur[i]) found[i] = { e, n }; });
    if (found.every(Boolean)) break;
  }
  found.forEach((f, i) => { if (f) out[i].tips.push({ key: 'ear', label: 'ودن الغطا', from: +ear0.toFixed(1), to: f.e, cut: +(ear0 - f.e).toFixed(1), ups: f.n }); });
  out.forEach(o => o.tips.sort((a, b) => (a.cut / Math.max(1, a.from)) - (b.cut / Math.max(1, b.from))));
  return out;
}
